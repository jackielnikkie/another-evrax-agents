[workspace]
members = ["crates/evrax-core", "crates/evrax-agent", "crates/evrax-remote", "crates/evrax-tui", "crates/evrax-store", "evrax-graph/evrax-graph"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
glob = "0.3"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
